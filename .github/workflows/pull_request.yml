name: Check PR

on:
  pull_request:
    branches: [gh-pages]

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked flake8 src tests
      - run: uv run --locked pylint src/eli tests
      - run: uv run --locked pyrefly check
      - run: uv run --locked mypy
      - run: uv run --locked pytest --cov=eli --cov-report=term-missing
      - run: uv run --locked eli check
      - run: uv run --locked eli build --output-dir build
      - run: uv run --locked eli validate-josm --build-dir build
      - run: uv run --locked eli site --build-dir build --output-dir build/site

  strict:
    name: Strict changed-source checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: uv sync --locked --no-dev
      - name: Check sources changed by this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          uv run --locked --no-dev eli check --strict
          --changed-from "$BASE_SHA" --head "$HEAD_SHA"
          --known-failures known-failures.json --report changed-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changed-source-audit
          path: changed-audit.json
          if-no-files-found: ignore
