name: Check PR

on:
  pull_request:
    branches:
      - gh-pages

jobs:
  check:
    name: Check PR
    runs-on: [ubuntu-24.04]
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip wheel PyYAML
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Basic check
        run: make check

      - name: Test libeli
        run: cd scripts && python -m pytest tests

      - name: Build all formats from source
        run: make clean all

      - name: Test tagged iD output and client canaries
        run: make test-id

      - name: Get file changes
        id: get_file_changes
        uses: trilom/file-changes-action@v1.2.4
        with:
          output: '" "'

      - name: Echo file changes
        run: |
          echo "Changed files: ${{ steps.get_file_changes.outputs.files }}"

      - name: Strict check
        run: |
          python scripts/strict_check.py "${{ steps.get_file_changes.outputs.files }}"
