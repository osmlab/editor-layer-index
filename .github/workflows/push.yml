name: Deploy

on:
  push:
    branches:
      - gh-pages

# Serialize generated-output commits from deployment jobs.
concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: [ubuntu-24.04]
    if: "!contains(github.event.head_commit.message, 'Deploy') && github.repository == 'osmlab/editor-layer-index'"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip wheel PyYAML
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Basic check
        run: make check

      - name: Test libeli
        run: cd scripts && python -m pytest tests

      - name: Delete old imagery files
        run: make clean

      - name: Generate imagery files
        run: make all

      - name: Test tagged iD output and client canaries
        run: make test-id

      - name: Configure Git author for generated commits
        # GitHub Actions bot identity from the official checkout example:
        # https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
        # The numeric prefix is the bot's GitHub account ID.
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Publish if the tested revision is still current
        env:
          TESTED_REVISION: ${{ github.sha }}
        run: python scripts/publish.py "$TESTED_REVISION"
