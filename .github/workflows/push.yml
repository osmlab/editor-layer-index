name: Deploy

on:
  push:
    branches: [gh-pages]
    paths-ignore:
      - imagery.geojson
      - imagery.json
      - imagery.xml
      - i18n/en.yaml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'osmlab/editor-layer-index'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: read
    outputs:
      head: ${{ steps.git-outputs.outputs.head }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true # Required for the compatibility-output push.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: uv sync --locked
      - run: uv run --locked pytest --cov=eli --cov-report=term-missing
      - run: uv run --locked eli check
      - run: uv run --locked eli build --output-dir build
      - run: uv run --locked eli site --build-dir build --output-dir build/site
      - name: Update generated files for Git consumers
        id: git-outputs
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: uv run --locked eli publish-git --build-dir build --expected-head "$EXPECTED_HEAD"
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a superseded deployment
        uses: actions/github-script@v9.0.0
        env:
          EXPECTED_HEAD: ${{ needs.build.outputs.head }}
        with:
          script: |
            const branch = await github.rest.repos.getBranch({...context.repo, branch: 'gh-pages'});
            if (branch.data.commit.sha !== process.env.EXPECTED_HEAD) {
              core.setFailed('gh-pages advanced; the newer workflow run will deploy');
            }
      - name: Deploy Pages artifact
        uses: actions/deploy-pages@v5.0.1
        id: deployment
