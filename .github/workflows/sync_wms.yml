name: ELI WMS sync

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wms-sync
  cancel-in-progress: false

jobs:
  wms_sync:
    if: github.repository == 'osmlab/editor-layer-index'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: gh-pages
          persist-credentials: true
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: uv sync --locked --no-dev
      - run: uv run --locked --no-dev eli sync-wms
      - run: uv run --locked --no-dev eli check
      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          base: gh-pages
          branch: bot/wms-sync
          add-paths: sources/**
          commit-message: Sync WMS sources
          delete-branch: true
          title: WMS Sync Bot
          body: Update WMS URLs and projections using `uv run eli sync-wms`; validate all sources with `uv run eli check`.
