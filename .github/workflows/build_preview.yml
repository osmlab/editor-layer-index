name: Build Preview

on:
  pull_request:
    branches:
      - gh-pages

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # If you're using actions/checkout@v4 you must set persist-credentials to false in most cases for the deployment to work correctly.
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip wheel PyYAML
          python -m pip install -r requirements.txt

      - name: Basic check
        run: find sources -name \*.geojson | xargs python scripts/check.py

      - name: Delete old imagery files
        run: make clean

      - name: Generate imagery files
        run: make all

      - uses: actions/checkout@v4
        with:
          repository: k-yle/iD
          path: './iD'
      - run: npm clean-install
        working-directory: './iD'
      - run: npm run all
        working-directory: './iD'
        env:
          ID_ELI_CDN_URL: '../../'
      - run: npm run dist
        working-directory: './iD'
        env:
          ID_ELI_CDN_URL: '../../'

      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            iD/dist
            imagery.geojson

      - name: Store pull request number for later use
        run: |
          echo ${{github.event.number}} > ./pr_number
      - uses: actions/upload-artifact@v4
        with:
          name: pr
          path: ./pr_number